# Triat — manifeste Flatpak durci
#
# Principe : aucune permission qui ne soit strictement nécessaire, et un
# libmpv sans lecteur en ligne de commande ni scripts. Il garde la vidéo et
# l'API de rendu OpenGL : l'écran Immersion dessine le clip dans une
# Gtk.GLArea (mpv_render_context). Le confinement est la principale protection
# contre les deux risques résiduels de l'audit (docs/security/) : yt-dlp et
# ffmpeg analysent tous deux des données distantes non fiables.
#
# Construction :
#   flatpak install org.gnome.Platform//51 org.gnome.Sdk//51
#   flatpak-builder --user --install --force-clean build packaging/flatpak/org.triat.Triat.yml

app-id: org.triat.Triat
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: triat

# FFmpeg complet : le runtime GNOME n'embarque que ffmpeg-free, sans une
# bonne partie des codecs (AAC, H.264) que sert YouTube. L'extension se
# monte dans /app/lib/ffmpeg.
# TODO : vérifier `version` contre le runtime-version choisi (l'extension
# suit la version de org.freedesktop.Platform, pas celle de GNOME).
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '26.08'
    add-ld-path: .
    autodownload: true
    autodelete: false

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

finish-args:
  # --- Indispensable ------------------------------------------------------
  - --share=network                 # YouTube, SponsorBlock, pochettes
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc                     # requis par X11
  - --device=dri                    # rendu GTK4

  # --- Audio --------------------------------------------------------------
  # Le socket « pulseaudio » couvre aussi PipeWire via sa couche de
  # compatibilité. Aucun accès micro n'est demandé.
  - --socket=pulseaudio

  # --- Trousseau ----------------------------------------------------------
  # Nécessaire au stockage chiffré des cookies. C'est la permission la plus
  # sensible du manifeste : elle donne accès au Secret Service, donc à
  # d'autres secrets de la session. À remplacer par le portail
  # org.freedesktop.portal.Secret dès que `keyring` le prendra en charge.
  - --talk-name=org.freedesktop.secrets

  # --- MPRIS --------------------------------------------------------------
  # Publication seulement : `own-name` sur notre propre préfixe, jamais
  # `talk-name=*` qui permettrait de piloter les autres lecteurs.
  - --own-name=org.mpris.MediaPlayer2.triat.*

  # --- Fichiers -----------------------------------------------------------
  # Un seul sous-dossier, créé au besoin. Surtout PAS --filesystem=home :
  # cela donnerait accès aux profils de navigateur, aux clés SSH, à tout.
  # Triat télécharge dans <dossier Musique>/Triat (core/paths.py,
  # `downloads_dir`). Flatpak résout `xdg-music` d'après les dossiers
  # utilisateur de l'hôte, quelle que soit la langue ; l'application lit
  # le même dossier avec GLib.get_user_special_dir.
  # `--filesystem=xdg-music` entier donnerait accès à toute la musique de
  # l'utilisateur sans nécessité : on s'en tient au sous-dossier.
  - --filesystem=xdg-music/Triat:create
  # L'import d'un cookies.txt passe par le portail de fichiers (une
  # autorisation ponctuelle, accordée fichier par fichier par l'utilisateur).

  # --- Veille -------------------------------------------------------------
  # Volontairement absente : aucun code n'inhibe la veille aujourd'hui.
  # Si on ajoute Gtk.Application.inhibit(SUSPEND) pendant la lecture, ce
  # sont le portail Inhibit et ce droit-ci qu'il faudra déclarer :
  #   - --talk-name=org.freedesktop.ScreenSaver

# PERMISSIONS VOLONTAIREMENT ABSENTES — ne pas ajouter sans raison écrite :
#   --filesystem=home           → accès aux profils navigateur et aux clés
#   --filesystem=host           → idem, en pire
#   --talk-name=org.freedesktop.Flatpak → évasion triviale du bac à sable
#   --device=all                → accès à tous les périphériques
#   --socket=session-bus        → contourne le filtrage D-Bus
#   --allow=devel               → ptrace et compagnie

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # --- libmpv, sans lecteur ni scripts -------------------------------------
  # Le lecteur en ligne de commande, les scripts Lua et JavaScript, et le
  # crochet yt-dlp intégré sont désactivés : autant de code en moins exposé
  # à des flux distants. Triat pilote libmpv par son API et résout les URL
  # lui-même. La vidéo et le rendu OpenGL restent activés (Immersion).
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dmanpage-build=disabled
      - -Dvideotoolbox-gl=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        # Renseigner le commit exact avant publication : un tag peut être
        # déplacé, un commit non.
        # commit: <à figer>
    modules:
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=disabled
          - -Dopengl=enabled
          - -Ddemos=false
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.349.0

  # --- Dépendances Python -------------------------------------------------
  # TODO (bloquant pour publier) : `python3-requirements.json` n'existe pas
  # encore dans le dépôt. Il se génère avec réseau, pas hors ligne :
  #   packaging/flatpak/gen-requirements.sh
  # (flatpak-pip-generator, à partir de requirements.lock). Ne jamais laisser
  # pip télécharger à la construction : le dépôt doit être reproductible et
  # vérifiable. PyGObject vient du runtime GNOME, pas de ce fichier.
  - python3-requirements.json

  # --- Triat ---------------------------------------------------------------
  # Sources explicites : jamais `path: ../..` en bloc, qui embarquerait
  # .venv, les APK, les captures et les données personnelles du dossier.
  - name: triat
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/triat.sh /app/bin/triat
      - mkdir -p /app/share/triat
      - cp -r triat data /app/share/triat/
      - find /app/share/triat -name __pycache__ -prune -exec rm -rf {} +
      - install -Dm644 packaging/flatpak/org.triat.Triat.desktop
          /app/share/applications/org.triat.Triat.desktop
      - install -Dm644 packaging/flatpak/org.triat.Triat.metainfo.xml
          /app/share/metainfo/org.triat.Triat.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/org.triat.Triat.svg
          /app/share/icons/hicolor/scalable/apps/org.triat.Triat.svg
    sources:
      - type: dir
        path: ../../triat
        dest: triat
        skip: [__pycache__]
      - type: dir
        path: ../../data
        dest: data
      - type: file
        path: triat.sh
        dest: packaging/flatpak
      - type: file
        path: org.triat.Triat.desktop
        dest: packaging/flatpak
      - type: file
        path: org.triat.Triat.metainfo.xml
        dest: packaging/flatpak
