[project]
name = "triat"
version = "0.1.0"
description = "Lecteur de musique YouTube pour Linux (GTK4, libadwaita, libmpv)"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["triat-public", "Koda", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "E402", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402", "F811", "E702"]
