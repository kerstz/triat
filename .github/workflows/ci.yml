name: CI

on:
  push:
  pull_request:
  schedule:
    # Canari quotidien : détecte une rupture d'extraction YouTube avant
    # les utilisateurs (TODO §4.16).
    - cron: '0 6 * * *'

# Jeton en lecture seule : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.13 : on teste le plancher et la version courante.
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libgtk-4-dev \
            libadwaita-1-dev gir1.2-gtk-4.0 gir1.2-adw-1 libmpv2 \
            python3-gi python3-gi-cairo xvfb
      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit ruff PyGObject
          pip check
          python -c "import qrcode, requests, yt_dlp_ejs"
      - name: Tests hors réseau
        run: xvfb-run -a python -m pytest -q
      - name: Linting
        run: ruff check triat tests

  securite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Audit des dépendances
        run: |
          pip install pip-audit
          pip install --require-hashes -r requirements.lock
          # Bloquant : une dépendance vulnérable ne passe pas.
          pip-audit --strict --progress-spinner off

  canari-extraction:
    # Le point de rupture numéro un de ce type d'application : YouTube
    # change, yt-dlp casse. On veut le savoir avant l'utilisateur.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule'
    continue-on-error: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: L'extraction répond-elle encore ?
        run: |
          python -c "
          import yt_dlp, sys
          opts = {'format': 'bestaudio/best', 'quiet': True, 'skip_download': True}
          with yt_dlp.YoutubeDL(opts) as ydl:
              info = ydl.extract_info('https://www.youtube.com/watch?v=jNQXAC9IVRw',
                                      download=False)
          sys.exit(0 if info and info.get('url') else 1)
          "
      - name: SponsorBlock répond-il encore ?
        run: python -m pytest -q -m network
