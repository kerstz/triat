name: CI

on:
  push:
  pull_request:
  schedule:
    # Canari quotidien : détecte une rupture d'extraction YouTube avant
    # les utilisateurs (TODO §4.16).
    - cron: '0 6 * * *'

# Jeton en lecture seule : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python >= 3.13 : on teste le plancher et la version courante.
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libgtk-4-dev \
            libadwaita-1-dev gir1.2-gtk-4.0 gir1.2-adw-1 libmpv2 \
            python3-gi python3-gi-cairo xvfb
      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          # Dépendances verrouillées, empreintes obligatoires. Les versions
          # flottantes sont couvertes par le job « canari-extraction ».
          pip install --require-hashes -r requirements.lock \
            -r requirements-dev.lock
          # PyGObject se compile contre les paquets système ci-dessus : il
          # n'est pas dans le verrou (pas de wheel Linux).
          pip install PyGObject
          pip check
          python -c "import qrcode, requests, yt_dlp_ejs"
      - name: Tests hors réseau
        run: xvfb-run -a python -m pytest -q
      - name: Linting
        run: ruff check triat tests

  metadonnees:
    # Fichiers de bureau et AppStream : l'installation Flathub les refuse
    # s'ils ne valident pas.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils de validation
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
      - name: appstreamcli validate
        run: appstreamcli validate --no-net packaging/flatpak/org.triat.Triat.metainfo.xml
      - name: desktop-file-validate
        run: desktop-file-validate packaging/flatpak/org.triat.Triat.desktop

  flatpak:
    # Construction réelle du Flatpak. Conteneur officiel flathub-infra (tag
    # gnome-51, correspondant au runtime du manifeste ; tag vérifié présent le
    # 2026-10-17). --privileged : bubblewrap a besoin des espaces de noms.
    # TODO non vérifié : jamais exécuté, flatpak-builder n'est pas installé
    # sur la machine de développement. Premier passage attendu en CI.
    # TODO : épingler l'image par digest (@sha256:...) une fois lu dans ghcr.io.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SHA du tag v6.8, lu avec git ls-remote le 2026-10-17. L'action exécute
      # flatpak-builder --user --install-deps-from=flathub.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: triat.flatpak
          manifest-path: packaging/flatpak/org.triat.Triat.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64

  securite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Audit des dépendances
        run: |
          pip install pip-audit
          pip install --require-hashes -r requirements.lock
          # Bloquant : une dépendance vulnérable ne passe pas.
          pip-audit --strict --progress-spinner off

  canari-extraction:
    # Le point de rupture numéro un de ce type d'application : YouTube
    # change, yt-dlp casse. On veut le savoir avant l'utilisateur.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule'
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      # Dépendances FLOTTANTES (requirements.txt, sans verrou) : détecte une
      # rupture amont avant qu'elle n'entre dans requirements.lock.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: L'extraction répond-elle encore ?
        run: |
          python -c "
          import yt_dlp, sys
          opts = {'format': 'bestaudio/best', 'quiet': True, 'skip_download': True}
          with yt_dlp.YoutubeDL(opts) as ydl:
              info = ydl.extract_info('https://www.youtube.com/watch?v=jNQXAC9IVRw',
                                      download=False)
          sys.exit(0 if info and info.get('url') else 1)
          "
      - name: Tests avec dépendances flottantes
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libgtk-4-dev \
            libadwaita-1-dev gir1.2-gtk-4.0 gir1.2-adw-1 libmpv2 \
            python3-gi python3-gi-cairo xvfb
          pip install PyGObject
          xvfb-run -a python -m pytest -q
      - name: SponsorBlock répond-il encore ?
        run: python -m pytest -q -m network
