name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Triat aims to stay small and quiet, so some ideas will be declined. Describing the need helps more than describing the solution.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like instead
      description: How you imagine it working. Sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues
          required: true
        - label: It does not need an account, a Triat server or telemetry
          required: true
